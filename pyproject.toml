[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bankkit"
version = "0.1.3"
description = "Python SDK for validating banking data — built for Latin America, ready for the world."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "Otavio Vicario Muraca"},
]
keywords = ["banking", "fintech", "validation", "latam", "iban", "swift", "pix", "cpf", "cnpj"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business :: Financial",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/otaviovicario/bankkit"
Repository = "https://github.com/otaviovicario/bankkit"
Issues = "https://github.com/otaviovicario/bankkit/issues"